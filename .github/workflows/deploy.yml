# main 에 푸시하면 Cloudflare Pages(hyu-jacket.pages.dev)로 배포한다. deploy.sh 와 같은 파일만 올린다.
# 비밀값은 GitHub Secrets(CLOUDFLARE_API_TOKEN = Pages 편집 전용 토큰, CLOUDFLARE_ACCOUNT_ID)에만 있다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect site files
        run: |
          mkdir out
          cp index.html out/
          cp -- *.jpg *.png out/
      - run: npx -y wrangler@4.156.2 pages deploy out --project-name hyu-jacket --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
